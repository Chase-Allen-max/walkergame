<title>Birkley's Doll Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: toy-box workbench. Doll on a spotlight stage, options in a side drawer, tools on a pegboard strip at the bottom. */
:root{
  --bg:#fff3f8; --ink:#3a2348; --pink:#ff4f9a; --grape:#7b4fd6; --card:#ffffff; --line:#f6cfe1; --peg:#ffe3ef; --wood:#d9a774;
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg) radial-gradient(var(--line) 1.6px,transparent 1.6px) 0 0/22px 22px;color:var(--ink);font-family:var(--body);font-weight:700;overflow-x:hidden}
.app{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);margin:0;line-height:1;color:var(--grape);text-wrap:balance}
h1 b{color:var(--pink)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.steps button{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:1.05rem}
.steps button[aria-current="step"]{background:var(--grape);border-color:var(--grape);color:#fff}
.steps button span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--peg);color:var(--ink);margin-right:6px;font-size:.85rem}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;flex:1}
@media (max-width:760px){main{grid-template-columns:minmax(0,1fr)}}
#view{min-width:0}
.spot{position:relative;background:radial-gradient(ellipse at 50% 92%,#ffd3e7 0 22%,transparent 23%),linear-gradient(#fff 0,#fff8fc 100%);border:4px solid #fff;border-radius:28px;box-shadow:0 8px 0 var(--line);display:grid;place-items:center;padding:30px 10px 14px;overflow:hidden;min-height:340px}
.doll{width:min(100%,300px);height:auto;max-height:62vh;overflow:visible}
.nameplate{font-family:var(--display);font-size:1.4rem;background:var(--pink);color:#fff;border-radius:999px;padding:2px 18px;margin-top:4px}
.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:18px;font-size:1.05rem;max-width:90%;text-align:center;z-index:5;display:flex;align-items:center;gap:8px}
.bubble svg{width:26px;height:26px;flex:none}
aside{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start}
aside h2{font-family:var(--display);margin:0;font-size:1.4rem;line-height:1.1}
aside h3{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.hint{margin:0;font-size:.95rem;line-height:1.35}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--peg);border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:8px;font-family:var(--display);font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--grape);transform:scale(1.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--peg);border-radius:14px;padding:7px 12px;font-size:.95rem}
.chips button[aria-pressed="true"]{background:var(--grape);color:#fff}
.checklist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checklist li{display:flex;align-items:center;gap:6px;font-size:.9rem;background:var(--peg);border-radius:12px;padding:5px 8px}
.checklist li.done{background:#d9f7e6}
.checklist svg{width:20px;height:20px;flex:none}
label.nm{display:grid;gap:4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
label.nm input{font:inherit;font-size:1.1rem;text-transform:none;letter-spacing:0;border:3px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--ink);background:#fff}
.big{font-family:var(--display);font-size:1.25rem;border-radius:16px;padding:10px 14px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #c92f74}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c92f74}
.big.alt{background:var(--grape);box-shadow:0 5px 0 #57339f}
.big:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#snd{width:44px;height:44px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:1.2rem}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--wood);padding:10px;border-radius:22px;box-shadow:inset 0 -6px 0 #b98656}
#tools button{background:#fff6ea;border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-family:var(--display);font-size:1.05rem;box-shadow:0 4px 0 #b98656}
#tools button svg{width:44px;height:44px}
#tools button[aria-pressed="true"]{background:#fff;outline:4px solid var(--pink);transform:translateY(-4px)}
/* doll parts */
.part,.ghost,.screw,.doll{transform-box:fill-box;transform-origin:50% 50%}
.ghost{fill:#ffffffb0;stroke:var(--grape);stroke-width:2;stroke-dasharray:6 5;cursor:pointer}
.ghost use{stroke:none}
.ghost.match{stroke:var(--pink);stroke-width:3;animation:glow .8s infinite alternate}
.part{cursor:pointer}
@keyframes glow{to{fill:#ffc9e1}}
.attach{animation:attach .55s cubic-bezier(.3,1.6,.5,1)}
.attach .screw{animation:spin .6s}
@keyframes attach{from{transform:translateY(-40px) scale(1.35);opacity:.2}}
@keyframes spin{from{transform:rotate(-540deg)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fx-bonk{animation:bonk .9s forwards}
@keyframes bonk{15%{transform:scale(1.2,.75)}30%{transform:scale(1)}100%{transform:translateY(420px) rotate(-35deg);opacity:0}}
.fx-drill .screw{animation:screwout .35s forwards}
.fx-drill{animation:fall .55s .35s ease-in forwards}
@keyframes screwout{to{transform:translate(0,-30px) rotate(720deg);opacity:0}}
@keyframes fall{to{transform:translateY(420px) rotate(30deg);opacity:0}}
.fx-zoom{animation:zoom .8s cubic-bezier(.6,-.4,.8,.4) forwards}
@keyframes zoom{to{transform:translateY(-460px) scale(.5);opacity:0}}
.fx-spin{animation:whirl .85s ease-in forwards}
@keyframes whirl{to{transform:translate(300px,-80px) rotate(900deg);opacity:0}}
.flip{animation:flip 1.1s ease-in-out}
@keyframes flip{40%{transform:translateY(-70px) rotate(180deg)}80%{transform:translateY(0) rotate(360deg)}90%{transform:scale(1.05,.92) rotate(360deg)}100%{transform:rotate(360deg)}}
.cf{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:50;pointer-events:none;animation:cf 1.9s ease-in forwards}
@keyframes cf{to{transform:translateY(106vh) rotate(var(--r))}}
/* house */
.house{max-width:660px;margin:0 auto;display:grid}
.roof{height:clamp(70px,14vw,110px);background:var(--pink);clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;align-items:end;justify-items:center;padding-bottom:8px;color:#fff;font-family:var(--display);font-size:clamp(1rem,3vw,1.4rem)}
.rooms{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;aspect-ratio:4/3;max-width:100%;background:#fff;border:8px solid #fff;border-top:0;border-radius:0 0 18px 18px;box-shadow:0 8px 0 var(--line);overflow:hidden}
.rooms{touch-action:pan-y}
.rooms.solo{grid-template-columns:1fr;grid-template-rows:1fr}
.rooms.in-left{animation:inL .3s ease-out}.rooms.in-right{animation:inR .3s ease-out}
@keyframes inL{from{transform:translateX(50px);opacity:.3}}@keyframes inR{from{transform:translateX(-50px);opacity:.3}}
.room{position:relative;border-bottom:14px solid var(--wood);cursor:pointer;container-type:inline-size;overflow:hidden}
.solo .rlabel{font-size:1rem}
.hnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hnav button{width:48px;height:48px;border-radius:50%;background:var(--grape);color:#fff;font-size:1.3rem;box-shadow:0 4px 0 #57339f}
.hnav b{font-family:var(--display);font-size:clamp(1.1rem,3.5vw,1.5rem);text-align:center}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dots button{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots button[aria-current="true"]{background:var(--pink);transform:scale(1.25)}
.item.furn{z-index:1}.item.rug{z-index:0}
.item.table{width:36cqw;height:18cqw}
.table .top{position:absolute;left:0;right:0;top:0;height:3cqw;background:#b57a45;border-radius:1cqw}
.table .leg{position:absolute;top:2cqw;bottom:0;width:2.6cqw;background:#8c5a2e}.table .l{left:3cqw}.table .r{right:3cqw}
.item.shelf{width:32cqw;height:2.6cqw;background:#b57a45;border-radius:1cqw;box-shadow:0 1.2cqw 0 #0002}
.item.rug{width:44cqw;height:13cqw;border-radius:50%;background:repeating-radial-gradient(#ff9cc8 0 2cqw,#ffd1e6 2cqw 4cqw)}
.rlabel{position:absolute;top:6px;left:8px;font-size:.75rem;background:#ffffffc0;border-radius:99px;padding:2px 8px;pointer-events:none}
.item{position:absolute;transform:translate(-50%,-50%);font-size:12cqw;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:3}
.item.dragging{cursor:grabbing;z-index:5;filter:drop-shadow(0 6px 4px #0003)}
.item.dollmini{width:20cqw;z-index:4}
.dollmini svg{width:100%;height:auto;pointer-events:none;overflow:visible}
.trash{margin-top:14px;border:3px dashed var(--line);border-radius:16px;padding:10px;text-align:center;font-size:.95rem;background:#fff}
.trash.hot{border-color:var(--pink);background:#ffe3ef}
.stickers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stickers button{font-size:1.7rem;padding:4px 0;border-radius:12px;background:var(--peg)}
/* bonus tray */
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:.85rem;margin-bottom:6px}
.tray b{font-family:var(--display);color:var(--pink);font-size:1.15rem}
.tray span{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px}
.tray.pop span{animation:popup .55s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*.15s)}
.tray svg{width:22px;height:22px}
@keyframes popup{from{transform:translateY(-40px) scale(.3);opacity:0}}
/* gym floor */
.mat{background:linear-gradient(#efe6ff 0 60%,#4f8fe8 60% 100%)}
.routine{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.card{display:grid;justify-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:4px 8px;font-size:.75rem;min-width:62px;transition:transform .2s}
.card i,.moves i{font-style:normal;font-size:1.7rem;line-height:1.2}
.card.now{border-color:var(--pink);transform:scale(1.15)}
.card.ok{background:#d9f7e6;border-color:#39c48b}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.moves button{background:var(--peg);border-radius:14px;padding:8px 2px;display:grid;justify-items:center;font-size:.85rem}
.moves button:active{transform:scale(.95)}
.moves button:disabled{opacity:.45;cursor:default}
.judges{display:flex;gap:8px;margin-top:10px}
.judges span{background:#fff;color:var(--grape);font-family:var(--display);font-size:1.7rem;padding:2px 14px;border-radius:10px;box-shadow:0 4px 0 #2f6cc4;animation:popup .55s cubic-bezier(.3,1.6,.5,1) backwards}
.judges span:nth-child(2){animation-delay:.2s}.judges span:nth-child(3){animation-delay:.4s}
.mv-cartwheel{animation:cart 1s ease-in-out}
@keyframes cart{50%{transform:translateX(70px) rotate(180deg)}100%{transform:rotate(360deg)}}
.mv-jump{animation:jump .9s}
@keyframes jump{40%{transform:translateY(-90px) scale(1.1)}70%{transform:scale(1.1,.9)}}
.mv-spin{animation:spinY 1s}
@keyframes spinY{to{transform:rotateY(720deg)}}
.mv-handstand{animation:hand 1.1s}
@keyframes hand{30%,70%{transform:translateY(-20px) rotate(180deg)}100%{transform:rotate(360deg)}}
.mv-split{animation:split 1s}
@keyframes split{30%,70%{transform:translateY(40px) scale(1.25,.7)}}
.mv-flip{animation:flip 1.1s ease-in-out}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div class="app">
  <header>
    <h1>Birkley's <b>Doll Workshop</b></h1>
    <nav class="steps" aria-label="Game steps">
      <button data-act="stage" data-v="build" data-stage-btn="build"><span>1</span>Build</button>
      <button data-act="stage" data-v="dress" data-stage-btn="dress"><span>2</span>Dress</button>
      <button data-act="stage" data-v="house" data-stage-btn="house"><span>3</span>House</button>

  </header>
  <main>
    <section id="view"></section>
    <aside id="panel"></aside>

  <nav id="tools" aria-label="Tools"></nav>
</div>

const TOPS={
  tee:{name:'T-shirt',d:'<path d="M70 112q0-14 14-14h32q14 0 14 14v74H70z"/><path d="M42 112q0-12 14-12h16v28H42z"/><path d="M158 112q0-12-14-12h-16v28h30z"/>'},

let ac;
function tone(f1,f2,d,type='sine',vol=.14,delay=0){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={hammer:()=>{tone(220,90,.12,'square',.12);tone(220,90,.12,'square',.12,.15)},drill:()=>tone(280,700,.45,'sawtooth',.06),magnet:()=>tone(400,1400,.35,'triangle'),wrench:()=>{tone(900,600,.08,'square',.08);tone(1100,700,.08,'square',.08,.1)},no:()=>tone(160,120,.25,'square',.08),pop:()=>tone(500,900,.1),yay:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.2,'triangle',.12,i*.12))};

/* ---------- doll drawing ---------- */
function screws(list){return list.map(([x,y])=>`<g transform="translate(${x} ${y})"><g class="screw"><circle r="4.5" fill="#e2e8ee" stroke="#6f7d8b" stroke-width="1.3"/><path d="M-2.8 0h5.6M0-2.8v5.6" stroke="#6f7d8b" stroke-width="1.3"/></g></g>`).join('')}
function face(){
  const f=S.face||'smile',ln='fill="none" stroke="#2d2240" stroke-width="2.5" stroke-linecap="round"';
  const eye=x=>`<ellipse cx="${x}" cy="60" rx="5" ry="6.5" fill="#2d2240"/><circle cx="${x+2}" cy="57.5" r="1.8" fill="#fff"/>`;
  const shut=x=>`<path d="M${x-5} 61q5 4 10 0" ${ln}/>`;
  const eyes=f==='wink'?eye(88)+shut(112):f==='sleepy'?shut(88)+shut(112):f==='wow'?`<circle cx="88" cy="60" r="6.5" fill="#2d2240"/><circle cx="112" cy="60" r="6.5" fill="#2d2240"/><circle cx="90" cy="57.5" r="2" fill="#fff"/><circle cx="114" cy="57.5" r="2" fill="#fff"/>`:eye(88)+eye(112);
  const mouth=f==='grin'?'<path d="M90 71q10 12 20 0z" fill="#2d2240"/><path d="M94 76q6 4 12 0" fill="#ff7fb5"/>':f==='wow'?'<ellipse cx="100" cy="76" rx="5" ry="6" fill="#2d2240"/>':f==='sleepy'?`<path d="M95 75q5 3 10 0" ${ln}/><text x="124" y="40" font-size="14" font-weight="900" fill="#7b4fd6" font-family="sans-serif">z</text>`:`<path d="M92 73q8 7 16 0" ${ln}/>`;
  return `<g stroke="none">${eyes}<circle cx="79" cy="71" r="5" fill="#ff7fb5" opacity=".55"/><circle cx="121" cy="71" r="5" fill="#ff7fb5" opacity=".55"/></g>${mouth}`}
function partSVG(k,o){
  const p=PARTS[k];
  if(S.parts[k]){
    let inner=p.d;
    if(k==='torso') inner+=`<path d="M100 158l-10-10a6 6 0 0 1 10-8a6 6 0 0 1 10 8z" fill="#ff4f9a" stroke="none"/><circle cx="88" cy="124" r="3" fill="#7be0b8" stroke="none"/><circle cx="112" cy="124" r="3" fill="#ffd34d" stroke="none"/>`;
    if(k==='head') inner+=`<g fill="${S.hairC}" stroke="none">${HAIR[S.hair].front}</g>${face()}<path d="M116 26l8-18" stroke="#6f7d8b" stroke-width="3"/><circle cx="125" cy="7" r="5" fill="#ff4f9a" stroke="none"/>`;
    return `<g class="part${justAttached===k?' attach':''}" data-part="${k}" fill="${S.color}" stroke="#3a234833" stroke-width="2">${inner}${screws(p.screws)}</g>`;
  }
  if(!o.ghosts) return '';
  return `<g class="ghost${S.mode==='build'&&S.tool===p.tool?' match':''}" data-part="${k}" role="button" aria-label="${p.name}, needs the ${TOOLS[p.tool].name}">${p.d}<use href="#t-${p.tool}" x="${p.ic[0]}" y="${p.ic[1]}" width="${k.startsWith('arm')?18:24}" height="${k.startsWith('arm')?18:24}"/></g>`;
}
function bonusSVG(layer,o){
  if(!allBuilt()) return '';
  return Object.entries(BONUS).filter(([,b])=>b.layer===layer).map(([k,b])=>{
    if(S.bonus[k]) return `<g class="part bonus${justAttached===k?' attach':''}" data-part="${k}" fill="${b.c}" stroke="#3a234833" stroke-width="2">${b.d}${b.fx}</g>`;
    if(!o.ghosts) return '';
    return `<g class="ghost bonus${S.mode==='build'&&S.tool===b.tool?' match':''}" data-part="${k}" role="button" aria-label="${b.name}, needs the ${TOOLS[b.tool].name}">${b.d}<use href="#t-${b.tool}" x="${b.ic[0]}" y="${b.ic[1]}" width="${b.s}" height="${b.s}"/></g>`;
  }).join('');
}
function dollSVG(o={}){
  const dressed=allBuilt();
  let s=`<svg class="doll" viewBox="0 0 200 320" role="img" aria-label="${esc(S.name)}">`;
  if(dressed) s+=`<g class="backlayer">${S.extras.map(x=>EXTRAS[x].back||'').join('')}</g>`;
  s+=bonusSVG('back',o);
  if(S.parts.head&&HAIR[S.hair].back) s+=`<g class="hairback" fill="${S.hairC}">${HAIR[S.hair].back}</g>`;
  s+=ORDER.slice(0,3).map(k=>partSVG(k,o)).join('');
  // clothes sit over legs and body, under arms only for sleeveless pieces
  if(dressed){
    s+=`<g class="clothes" stroke="#3a234833" stroke-width="2">`;
    if(!FULL.includes(S.top)) s+=`<g fill="${S.bottomC}">${BOTTOMS[S.bottom].d}</g>`;
    s+=`<g fill="${S.shoesC}">${SHOES[S.shoes].d}</g>`;
    s+=`</g>`;
  }
  s+=bonusSVG('mid',o);
  s+=ORDER.slice(3).map(k=>partSVG(k,o)).join('');
  if(dressed){
    s+=`<g class="clothes" stroke="#3a234833" stroke-width="2"><g fill="${S.topC}">${TOPS[S.top].d}</g></g>`;
    s+=`<g class="clothes">${S.extras.map(x=>EXTRAS[x].front||'').join('')}</g>`;
  }
  s+=bonusSVG('front',o);
  return s+'</svg>';
}

  const tray=missing.length?`<div class="tray${popTray?' pop':''}"><b>New parts!</b>${missing.map((k,i)=>`<span style="--i:${i}"><svg viewBox="0 0 24 24"><use href="#t-${BONUS[k].tool}"/></svg>${BONUS[k].name}</span>`).join('')}</div>`:'';
  $('#view').innerHTML=S.stage==='house'?houseHTML():S.stage==='gym'?gymHTML():`<div class="spot"><div class="bubble" id="bubble" hidden></div>${tray}${dollSVG({ghosts:S.stage==='build'})}<div class="nameplate" id="plate">${esc(S.name)}</div></div>`;
  $('#panel').innerHTML={build:buildPanel,dress:dressPanel,house:housePanel,gym:gymPanel}[S.stage]();
  $('#snd').textContent=S.sound?'🔊':'🔇';$('#snd').setAttribute('aria-pressed',S.sound);
  $('#tools').hidden=S.stage!=='build';
  $('#tools').innerHTML=Object.entries(TOOLS).map(([k,t])=>`<button data-act="tool" data-v="${k}" aria-pressed="${S.tool===k}"><svg viewBox="0 0 24 24"><use href="#t-${k}"/></svg>${t.name}</button>`).join('');
  save();
}

/* ---------- helpers ---------- */
function say(msg,tool){const b=$('#bubble');if(!b)return;b.innerHTML=(tool?`<svg viewBox="0 0 24 24"><use href="#t-${tool}"/></svg>`:'')+esc(msg);b.hidden=false;clearTimeout(bubbleT);bubbleT=setTimeout(()=>b.hidden=true,2200)}
const PRAISE=['Click! Nice work!','You did it!','Super builder!','Snap! Perfect!','Woohoo!'];
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#ff4f9a','#7b4fd6','#f5c542','#39c48b','#5bb8f5'];for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDelay=Math.random()*.5+'s';d.style.setProperty('--r',(Math.random()*900-450)+'deg');document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function photo(){
  const W=600,H=800,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createRadialGradient(W/2,H*.45,40,W/2,H*.45,W*.8);g.addColorStop(0,'#fff');g.addColorStop(1,'#ffd3e7');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#ffffffaa';for(let i=0;i<40;i++){x.beginPath();x.arc(Math.random()*W,Math.random()*H,2+Math.random()*4,0,7);x.fill()}
  const svg=dollSVG().replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" ');
  const img=new Image();
  img.onload=()=>{
    x.drawImage(img,100,40,400,640);
    x.fillStyle='#ff4f9a';x.beginPath();x.roundRect(W/2-170,700,340,64,32);x.fill();
    x.fillStyle='#fff';x.font='800 34px "Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(S.name,W/2,733);
    c.toBlob(async b=>{
      const file=new File([b],(S.name||'doll').replace(/[^\w ]/g,'')+'.png',{type:'image/png'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.name});return}}catch(e){if(e.name==='AbortError')return}
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    },'image/png');
    SFX.yay();say('Say cheese! 📸');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const keys=o=>Object.keys(o);

function onPart(k,el){
  const isB=!!BONUS[k],p=isB?BONUS[k]:PARTS[k],st=isB?S.bonus:S.parts;
  if(S.mode==='build'){
    if(st[k]) return say('Already on! Switch to Take apart to pop it off.');
    if(S.tool!==p.tool){el.classList.remove('shake');el.getBoundingClientRect();el.classList.add('shake');SFX.no();return say(`Use the ${TOOLS[p.tool].name}!`,p.tool)}
    const was=allBuilt();
    st[k]=1;SFX[p.tool]();justAttached=k;popTray=!was&&allBuilt();render();justAttached=null;popTray=false;
    if(!was&&allBuilt()){setTimeout(()=>{confetti();SFX.yay()},350);say('She\'s built! New parts popped up!')}
    else if(isB&&keys(BONUS).every(x=>S.bonus[x])){setTimeout(()=>{confetti();SFX.yay()},350);say(`${S.name} is a SUPER robot!`)}
    else say(pick(PRAISE));
  }else{
    if(!st[k]||busy) return;
    busy=true;
    if(!isB) $$('.clothes,.hairback,.backlayer,.bonus').forEach(n=>n.remove());
    el.classList.add({hammer:'fx-bonk',drill:'fx-drill',magnet:'fx-zoom',wrench:'fx-spin'}[S.tool]);
    SFX[S.tool]();
    setTimeout(()=>{st[k]=0;busy=false;render();if(ORDER.every(x=>!S.parts[x]))say('All apart! Tap Build to put her back together.');else say({hammer:'BONK!',drill:'Unscrewed!',magnet:'Zoooom!',wrench:'Spinny!'}[S.tool])},950);
  }
}

/* ---------- gymnastics floor ---------- */
function gymHTML(){
  const cards=G.routine.length?G.routine.map((m,i)=>`<span class="card${G.phase!=='watch'&&i<G.step?' ok':''}${i===G.cur?' now':''}"><i>${MOVES[m].e}</i>${MOVES[m].name}</span>`).join(''):'<span class="hint">Tap Start routine. Watch her, then copy the moves!</span>';
  return `<div class="spot mat"><div class="bubble" id="bubble" hidden></div><div class="routine">${cards}</div>${dollSVG()}<div class="nameplate" id="plate">${esc(S.name)}</div>${G.phase==='done'?`<div class="judges">${G.scores.map(s=>`<span>${s}</span>`).join('')}</div>`:''}</div>`;
}
function gymPanel(){
  const hint={idle:'Tap Start routine and watch what she does.',watch:'Watch carefully…',turn:'Your turn! Tap the moves in the same order.',done:'Amazing! Start again for a longer routine.'}[G.phase];
  return `<h2>Floor routine</h2><p class="hint">${hint}</p><h3>Level ${S.level-2} · ${S.level} moves</h3>
  <div class="moves">${keys(MOVES).map(m=>`<button data-act="move" data-v="${m}"${G.phase==='watch'?' disabled':''}><i>${MOVES[m].e}</i>${MOVES[m].name}</button>`).join('')}</div>
  <button class="big" data-act="watch"${G.phase==='watch'?' disabled':''}>${G.phase==='turn'?'Watch again':'Start routine'}</button>`;
}
function animDoll(cls){const d=$('.spot .doll');if(!d)return;d.setAttribute('class','doll');d.getBoundingClientRect();d.setAttribute('class','doll '+cls)}
function perform(m){animDoll('mv-'+m);tone(300,700,.3,'triangle',.1)}
function watch(fresh){
  if(fresh){const r=[];for(let i=0;i<S.level;i++){let m;do m=pick(keys(MOVES));while(m===r[i-1]);r.push(m)}G.routine=r;G.mistakes=0}
  const run=++G.run,ok=()=>run===G.run&&S.stage==='gym';
  G.phase='watch';G.step=0;G.cur=-1;render();
  G.routine.forEach((m,i)=>setTimeout(()=>{if(!ok())return;G.cur=i;render();perform(m)},400+i*1200));
  setTimeout(()=>{if(!ok())return;G.phase='turn';G.cur=0;render();say('Your turn!')},400+G.routine.length*1200);
}
function doMove(m){
  if(G.phase!=='turn') return perform(m);
  if(m===G.routine[G.step]){
    G.step++;G.cur=G.step<G.routine.length?G.step:-1;render();perform(m);
    if(G.step===G.routine.length){const run=G.run;setTimeout(()=>{if(run===G.run&&S.stage==='gym')finish()},1100)}
  }else{G.mistakes++;SFX.no();animDoll('shake');say(`Oops! Next is ${MOVES[G.routine[G.step]].name}`)}
}
function finish(){
  const base=Math.max(7,10-.5*G.mistakes);
  G.scores=[base,Math.min(10,base+(G.mistakes?.5:0)),base].map(s=>s.toFixed(1));
  G.phase='done';S.level=Math.min(9,S.level+1);render();confetti();SFX.yay();say(G.mistakes?'Great routine!':'PERFECT 10!');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const part=e.target.closest('[data-part]');
  if(part&&S.stage==='build'){onPart(part.dataset.part,part);return}
  const room=e.target.closest('[data-room]');
  if(swiped){swiped=false;return}
  if(room&&!e.target.closest('.item')){
    if(S.paint){S.walls[+room.dataset.room]=S.paint;SFX.pop();render();return}
    if(!S.view){goView(+room.dataset.room+1,'in-left');return}
  }
  const b=e.target.closest('[data-act]');if(!b)return;
  const v=b.dataset.v;
  switch(b.dataset.act){
    case 'stage': if(v!=='build'&&!allBuilt()){ORDER.forEach(k=>S.parts[k]=1)} S.stage=v; if(v==='gym')G={phase:'idle',routine:[],step:0,mistakes:0,cur:-1,run:G.run+1,scores:[]}; SFX.pop(); break;
    case 'move': doMove(v); return;
    case 'watch': watch(G.phase!=='turn'); return;
    case 'mode': S.mode=v; break;
    case 'tool': S.tool=v; SFX.pop(); break;
    case 'color': S.color=v; break;
    case 'autobuild': ORDER.forEach(k=>S.parts[k]=1); S.mode='build'; popTray=true; render(); popTray=false; confetti(); SFX.yay(); say('She\'s built! New parts popped up!'); return;
    case 'tab': S.tab=v; break;
    case 'face': S.face=v; SFX.pop(); break;
    case 'photo': photo(); return;
    case 'sound': S.sound=!S.sound; if(S.sound)SFX.pop(); break;
    case 'hair': case 'top': case 'bottom': case 'shoes': S[b.dataset.act]=v; SFX.pop(); break;
    case 'hairC': case 'topC': case 'bottomC': case 'shoesC': S[b.dataset.act]=v; break;
    case 'extra': S.extras=S.extras.includes(v)?S.extras.filter(x=>x!==v):[...S.extras,v]; SFX.pop(); break;
    case 'surprise': Object.assign(S,{hair:pick(keys(HAIR)),hairC:pick(HAIR_COLORS),top:pick(keys(TOPS)),topC:pick(CLOTH_COLORS),bottom:pick(keys(BOTTOMS)),bottomC:pick(CLOTH_COLORS),shoes:pick(keys(SHOES)),shoesC:pick(CLOTH_COLORS),face:pick(keys(FACES)),extras:keys(EXTRAS).filter(()=>Math.random()<.3)}); SFX.yay(); break;
    case 'flip': { const d=$('.spot .doll'); if(d){d.classList.remove('flip');d.getBoundingClientRect();d.classList.add('flip');tone(300,900,.5,'triangle');setTimeout(()=>{say('Perfect 10!');SFX.yay()},1000)} return; }
    case 'add': S.items.push({e:v,r:S.view?S.view-1:S.lastRoom,x:35+Math.random()*30,y:FURN[v]?70:35+Math.random()*30}); SFX.pop(); break;
    case 'view': if(v==='next')goView(S.view+1,'in-left');else if(v==='prev')goView(S.view-1,'in-right');else goView(+v,+v>S.view?'in-left':'in-right'); return;
    case 'paint': S.paint=S.paint===v?null:v; break;
    case 'clear': S.items=[]; break;
    default: return;
  }
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value||'My doll';const p=$('#plate');if(p)p.textContent=S.name;save()}});

/* drag in the house */
let drag=null,swipe=null,swiped=false;
document.addEventListener('pointerdown',e=>{
  const it=e.target.closest('.item');
  if(!it){if(e.target.closest('#rooms'))swipe={x:e.clientX,y:e.clientY};return}
  e.preventDefault();it.setPointerCapture(e.pointerId);it.classList.add('dragging');
  const room=it.closest('.room');
  drag={el:it,id:it.dataset.item,sx:e.clientX,sy:e.clientY,moved:false,room:room,r:+room.dataset.room};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;
  // in the whole-house view, things can be dragged from one room to another
  const over=$$('.room').find(rm=>{const b=rm.getBoundingClientRect();return e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom});
  if(over&&over!==drag.room){over.appendChild(drag.el);drag.room=over;drag.r=+over.dataset.room}
  const r=drag.room.getBoundingClientRect();
  const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
  drag.el.style.left=x+'%';drag.el.style.top=y+'%';drag.x=x;drag.y=y;
  const t=$('#trash').getBoundingClientRect();
  $('#trash').classList.toggle('hot',drag.id!=='doll'&&e.clientY>=t.top-10&&e.clientX>=t.left&&e.clientX<=t.right);
});
document.addEventListener('pointerup',e=>{
  if(swipe){const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){swiped=true;setTimeout(()=>swiped=false,400);goView(S.view+(dx<0?1:-1),dx<0?'in-left':'in-right')}
    return}
  if(!drag)return;
  const d=drag;drag=null;d.el.classList.remove('dragging');
  const hot=$('#trash').classList.contains('hot');
  $('#trash').classList.remove('hot');
  if(!d.moved)return;
  if(d.id==='doll'){S.doll={r:d.r,x:d.x,y:d.y};save();return}
  if(hot){S.items.splice(+d.id,1);tone(600,150,.25,'triangle');render();return}
  Object.assign(S.items[+d.id],{r:d.r,x:d.x,y:d.y});save();
});

render();
</script>

<script>if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
